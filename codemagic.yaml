workflows:
  android-debug-build:
    name: MIUI Dialer Debug APK
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          # Handle both zip structures
          if [ -f "MIUIDialer/settings.gradle.kts" ]; then
            cd MIUIDialer
          fi
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          curl -L -o gradlew \
            https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew
          chmod +x gradlew
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - MIUIDialer/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - Krishna570023@email.com
        notify:
          success: true
          failure: true
